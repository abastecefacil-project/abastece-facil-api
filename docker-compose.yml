services:
  postgres:
    image: postgres:15-alpine
    container_name: abastecefacil-db
    environment:
      POSTGRES_DB: abastecefacil
      POSTGRES_USER: abastecefacil_user
      POSTGRES_PASSWORD: abastecefacil_password
    # 5433 no host, 5432 dentro da rede. A porta 5432 do host costuma estar tomada
    # por uma instalacao nativa do PostgreSQL; quando isso acontece o Docker publica
    # so em IPv6 e uma conexao para localhost:5432 cai silenciosamente no Postgres
    # errado, falhando com "autenticacao do tipo senha falhou". Publicar em 5433
    # elimina a ambiguidade. Container e pgAdmin nao usam esta porta: eles falam
    # postgres:5432 pelo DNS interno da rede.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - abastecefacil-network
    restart: unless-stopped

  api:
    build: .
    container_name: abastecefacil-api
    ports:
      - "8081:8081"
    environment:
      # O endereco e as credenciais do banco moram em application-docker.yml, ativado
      # por este perfil. Antes estavam duplicados aqui. Variavel de ambiente continua
      # tendo precedencia sobre o arquivo, entao em outro ambiente basta declarar
      # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD aqui de novo.
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - postgres
    networks:
      - abastecefacil-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: abastecefacil-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@abastecefacil.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - abastecefacil-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  abastecefacil-network:
    driver: bridge
