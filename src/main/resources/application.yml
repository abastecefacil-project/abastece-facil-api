spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/abastecefacil
    username: abastecefacil_user
    password: abastecefacil_password
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8081

jwt:
  secret: YWJhc3RlY2VmYWNpbC1zZWNyZXQta2V5LTIwMjQtdmVyeS1sb25nLWFuZC1zZWN1cmUta2V5LWZvci1qd3Qtc2lnbmluZw==
  expiration: 86400000

abastecefacil:
  token:
    # Prazo de vida dos tokens de acesso enviados por e-mail, em horas.
    # Ativação é mais longa porque o usuário pode demorar a abrir o convite;
    # recuperação é curta porque a ação é imediata e o risco é maior.
    ativacao-horas: 48
    recuperacao-horas: 1

viacep-api:
  url: "https://viacep.com.br/ws/"

openstreetmap-api:
  url: "https://nominatim.openstreetmap.org"
  user-agent: "${OPENSTREETMAP_USER_AGENT:PostoApp (pedrohenriquedasilvapereira12@gmail.com)}"

