# Configuração base + defaults de DESENVOLVIMENTO LOCAL (nenhum perfil ativo).
# Vale para ./mvnw spring-boot:run rodando na máquina, contra o Postgres do compose.
#
# Dentro do container o perfil "docker" está ativo e o application-docker.yml
# sobrescreve apenas o datasource. Tudo que está aqui e não aparece lá vale nos dois.
#
# Precedência: variável de ambiente > application-docker.yml > este arquivo.
# Qualquer propriedade abaixo aceita override por env var na forma maiúscula com
# underscore (spring.datasource.url -> SPRING_DATASOURCE_URL). Ver §3 do CLAUDE.md.

spring:
  datasource:
    # Porta 5433, e não 5432: o compose publica o Postgres em 5433 no host porque
    # 5432 costuma já estar tomada por uma instalação nativa do PostgreSQL. Dentro
    # da rede do compose continua sendo postgres:5432. Ver §3 do CLAUDE.md.
    url: jdbc:postgresql://localhost:5433/abastecefacil
    username: abastecefacil_user
    password: abastecefacil_password
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8081

jwt:
  # Segredo de desenvolvimento, versionado desde o início do projeto. Em produção,
  # sobrescrever com a variável de ambiente JWT_SECRET — nunca editar este valor aqui.
  secret: YWJhc3RlY2VmYWNpbC1zZWNyZXQta2V5LTIwMjQtdmVyeS1sb25nLWFuZC1zZWN1cmUta2V5LWZvci1qd3Qtc2lnbmluZw==
  expiration: 86400000

abastecefacil:
  token:
    # Prazo de vida dos tokens de acesso enviados por e-mail, em horas.
    # Ativação é mais longa porque o usuário pode demorar a abrir o convite;
    # recuperação é curta porque a ação é imediata e o risco é maior.
    ativacao-horas: 48
    recuperacao-horas: 1
  admin:
    # Administrador inicial, criado na subida por AdministradorInicialInitializer.
    # Vazio aqui de propósito: sem e-mail e hash a criação é pulada e a aplicação sobe
    # normalmente, que é o comportamento desejado em desenvolvimento.
    #
    # NUNCA preencher senha-hash neste arquivo — ele é versionado. O valor vem da
    # variável de ambiente ABASTECEFACIL_ADMIN_SENHA_HASH, e o hash se gera pelo
    # caminho documentado no README, seção "Gerar o hash BCrypt".
    #
    # Atenção: admin@abastecefacil.com já existe no init-scripts/dump.sql com perfil
    # COLABORADOR. Configurar esse e-mail faz o inicializador encontrar o registro e
    # não criar nada. Use outro endereço.
    nome: "Administrador"
    email: ""
    senha-hash: ""

viacep-api:
  url: "https://viacep.com.br/ws/"

openstreetmap-api:
  url: "https://nominatim.openstreetmap.org"
  # A política de uso do Nominatim exige um User-Agent com contato válido. O default
  # abaixo é genérico de propósito; em produção, apontar OPENSTREETMAP_USER_AGENT para
  # um endereço realmente monitorado, senão o serviço pode bloquear as requisições.
  user-agent: "${OPENSTREETMAP_USER_AGENT:AbasteceFacil/1.0 (contato@abastecefacil.com.br)}"
